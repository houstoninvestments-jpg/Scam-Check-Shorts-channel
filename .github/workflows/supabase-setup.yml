name: Supabase setup (one-off)

# Started by hand only. Builds and locks down the database, deploys the edge functions, tests the live signup,
# and (later) connects Stripe TEST mode. Uses the short-lived SUPABASE_ACCESS_TOKEN; the daily job never does.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "setup = database, keys, functions | test = real signup on the live site, then delete it | stripe = Stripe TEST mode into Supabase | purchase-test = one test-card purchase, unlock, refund, clean up"
        type: choice
        options: [setup, test, stripe, purchase-test, diagnose, webhook-check, refund-orphans]
        default: setup

permissions:
  contents: write   # save the public URL, publishable key and payment link to config/channel.json

concurrency:
  group: supabase-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: gnzefjbxpqpjxfvribyg
      SITE_BASE_URL: https://scamornotdaily.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Check the token is set (name only)
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error title=Missing secret::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          echo "::notice title=Token::SUPABASE_ACCESS_TOKEN is set"

      - name: Retired (the old test key belongs to a different Stripe account)
        if: inputs.step == 'stripe' || inputs.step == 'purchase-test' || inputs.step == 'webhook-check' || inputs.step == 'refund-orphans' || inputs.step == 'diagnose'
        run: |
          echo "::error title=Retired::Stripe test steps are retired: STRIPE_SECRET_KEY belongs to a different Stripe account. The Family Pass is live in the Scam or Not account (stripe-live.yml)."
          exit 1

      - name: Database, keys and function settings
        if: inputs.step == 'setup'
        run: npx tsx scripts/supabase-setup.mjs setup

      - uses: supabase/setup-cli@v1
        if: inputs.step == 'setup'
        with:
          version: latest

      - name: Deploy the edge functions
        if: inputs.step == 'setup'
        run: |
          # --use-api bundles on Supabase's side, so no Docker is needed here.
          supabase functions deploy --project-ref "$PROJECT_REF" --use-api
          npx tsx scripts/supabase-setup.mjs functions

      - name: Live signup test
        if: inputs.step == 'test'
        run: npx tsx scripts/supabase-setup.mjs test

      - name: Save config
        if: always()
        run: |
          git config user.name "scam-or-not-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/channel.json
          if git diff --cached --quiet; then exit 0; fi
          scripts/secret-scan.sh
          git commit -q -m "Supabase setup: ${{ inputs.step }}"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep $((2**i)); done
