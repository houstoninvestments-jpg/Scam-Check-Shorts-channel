name: Checks

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Saved ffmpeg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-debs
          key: ffmpeg-debs-${{ runner.os }}-v1
      - name: ffmpeg (skip if already there; saved packages first, Ubuntu's mirror as the fallback)
        run: scripts/install-ffmpeg.sh
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: scripts/secret-scan.sh --all
