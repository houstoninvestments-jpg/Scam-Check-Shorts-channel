name: Checks

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg (skip if already there; time-limited retries, since Ubuntu's mirror sometimes stalls)
        run: if ! command -v ffmpeg >/dev/null; then for i in 1 2 3; do timeout 240 sudo apt-get update -q && timeout 300 sudo apt-get install -y -q ffmpeg && break; echo "ffmpeg install try $i stalled; retrying"; sleep 10; done; fi; command -v ffmpeg
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: scripts/secret-scan.sh --all
