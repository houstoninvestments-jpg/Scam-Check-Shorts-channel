name: Domain and email setup (one-off)

# Started by hand only. scamornotdaily.com: Resend sending domain and DNS, Supabase auth emails
# through Resend, the custom domain on the Pages site, and an end-to-end test purchase.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "check = what the tokens can do | email = Resend + DNS + Supabase email | site = custom domain on the site | e2e = test purchase with a real sign-in email"
        type: choice
        options: [check, email, site, e2e]
        default: check

permissions:
  contents: write   # save the new site address

concurrency:
  group: domain-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      PROJECT_REF: gnzefjbxpqpjxfvribyg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Which keys are set (names only)
        run: |
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_DNS_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY SUPABASE_ACCESS_TOKEN STRIPE_SECRET_KEY; do [ -n "${!n}" ] && s="$s $n" || m="$m $n"; done
          echo "::notice title=Keys set::${s:- none}"; [ -z "$m" ] || echo "::warning title=Keys missing::$m"

      - name: Run step
        run: npx tsx scripts/domain-setup.mjs ${{ inputs.step }}

      - name: Save the new address
        if: always() && inputs.step == 'site'
        run: |
          git config user.name "scam-or-not-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/channel.json data/site-target.json
          if git diff --cached --quiet; then exit 0; fi
          scripts/secret-scan.sh
          git commit -q -m "Site address: scamornotdaily.com"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep $((2**i)); done
