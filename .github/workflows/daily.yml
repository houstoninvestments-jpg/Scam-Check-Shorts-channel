name: Daily Short

on:
  schedule:
    # Up to 3 a day at 7:20am, 12:20pm and 5:20pm Pacific (config/channel.json cadence.slots).
    # Cron is UTC with no daylight saving, so each slot is listed for both PDT and PST;
    # the gate job lets only the one that lands on the Pacific time go ahead.
    - cron: "20 14 * * *"   # 7:20am PDT
    - cron: "20 15 * * *"   # 7:20am PST
    - cron: "20 19 * * *"   # 12:20pm PDT
    - cron: "20 20 * * *"   # 12:20pm PST
    - cron: "20 0 * * *"    # 5:20pm PDT
    - cron: "20 1 * * *"    # 5:20pm PST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (render only, nothing uploaded)"
        type: boolean
        default: false
      slot:
        description: "Run as this posting slot (1, 2 or 3). Empty = a manual run outside the slots"
        type: string
        default: ""
      live_test:
        description: "Dry run with live sources and the real model: real checks and real cost, nothing uploaded"
        type: boolean
        default: false
      evidence:
        description: "Also save screenshots of the live privacy, home and terms pages (for Google's API audit form)"
        type: boolean
        default: false
      preview_number:
        description: "Instead of making a Short: re-render this saved Scam number with today's template and the real voice, as a labeled preview (nothing uploaded)"
        type: string
        default: ""
      release_number:
        description: "Instead of making a Short: make this hidden upload public if it is clean (Scam number, e.g. 1)"
        type: string
        default: ""
      release_run:
        description: "Run id that uploaded it (its video file is checked frame by frame)"
        type: string
        default: ""
      control_run:
        description: "Optional: run id of a clean live video, for comparison"
        type: string
        default: ""

permissions:
  contents: write   # commit the ledger and stats back to main
  pages: write      # publish the website
  id-token: write   # required by the Pages deploy action
  issues: write     # health check opens an issue only when something breaks
  actions: read     # release mode reads the video file kept by an earlier run

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  gate:
    # Which slot this firing is. The off-season twin of each slot exits here in seconds.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.slot.outputs.go }}
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pick the slot
        id: slot
        run: npx tsx src/cli.ts slot-gate ${{ github.event_name == 'schedule' && format('--schedule "{0}"', github.event.schedule) || '' }} ${{ inputs.slot != '' && format('--slot {0}', inputs.slot) || '' }}

  short:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      # Website host: Cloudflare Pages once both are set; GitHub Pages until then.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KOKORO_DIR: ${{ github.workspace }}/models/kokoro
      SLOT: ${{ needs.gate.outputs.slot }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-voice.txt

      - name: Install
        run: |
          # Skip if already there; time-limited retries, since Ubuntu's mirror sometimes stalls.
          if ! command -v ffmpeg >/dev/null; then for i in 1 2 3; do timeout 240 sudo apt-get update -q && timeout 300 sudo apt-get install -y -q ffmpeg && break; echo "ffmpeg install try $i stalled; retrying"; sleep 10; done; fi; command -v ffmpeg
          npm ci
          pip install -q -r requirements-voice.txt

      - name: Free voice model (fallback)
        uses: actions/cache@v4
        with:
          path: models/kokoro
          key: kokoro-v1.0-int8

      - name: Download voice model if not cached
        run: |
          mkdir -p models/kokoro && cd models/kokoro
          [ -f kokoro-v1.0.int8.onnx ] || curl -sSL -o kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f voices-v1.0.bin ] || curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Check which keys are set (names only)
        run: |
          set_list=""; missing=""
          for n in ANTHROPIC_API_KEY ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -n "${!n}" ]; then set_list="$set_list $n"; else missing="$missing $n"; fi
          done
          echo "::notice title=Keys set::${set_list:- none}"
          [ -z "$missing" ] || echo "::warning title=Keys missing::$missing"

      - name: Pick the website address
        id: site
        # Sets SITE_BASE_URL for every later step, so descriptions, share cards and links all use it.
        run: npx tsx src/cli.ts site-target

      - name: Video file that was uploaded (release mode)
        if: inputs.release_number != '' && inputs.release_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: short-${{ inputs.release_run }}
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
          path: work/release/uploaded

      - name: Clean video for comparison (release mode)
        if: inputs.release_number != '' && inputs.control_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: short-${{ inputs.control_run }}
          run-id: ${{ inputs.control_run }}
          github-token: ${{ github.token }}
          path: work/release/control

      - name: Make the Short
        id: run
        run: |
          if [ -n "${{ inputs.preview_number }}" ]; then
            # Preview mode: no new Short, nothing sent to YouTube. The file is kept on a hidden ref
            # (refs/previews/...), not on any branch, so it can be fetched without touching main.
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            n=$(printf '%03d' "${{ inputs.preview_number }}")
            npx tsx src/cli.ts rerender --number "${{ inputs.preview_number }}" --work work/preview
            git config user.name "scam-or-not-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            blob=$(git hash-object -w "work/preview/scam-$n-preview.mp4")
            tree=$(printf '100644 blob %s\tscam-%s-preview.mp4\n' "$blob" "$n" | git mktree)
            commit=$(git commit-tree "$tree" -m "Preview of Scam No. $n")
            git push -f -q origin "$commit:refs/previews/scam-$n"
            echo "::notice title=Preview file::saved to refs/previews/scam-$n"
            exit 0
          fi
          if [ -n "${{ inputs.release_number }}" ]; then
            # Release mode: no new Short. Check the hidden upload on YouTube and publish it only if clean.
            echo "mode=release" >> "$GITHUB_OUTPUT"
            n=$(printf '%03d' "${{ inputs.release_number }}")
            video=$(find work/release/uploaded -name "scam-$n.mp4" 2>/dev/null | head -1)
            control=$(find work/release/control -name '*.mp4' 2>/dev/null | head -1)
            npx tsx src/cli.ts release --number "${{ inputs.release_number }}" ${video:+--video "$video"} ${control:+--control "$control"}
            exit 0
          fi
          # Until the one-time YouTube authorization is done, run the full pipeline in dry-run mode.
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$YOUTUBE_REFRESH_TOKEN" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "mode=dry" >> "$GITHUB_OUTPUT"
            live=""; [ "${{ inputs.live_test }}" = "true" ] && live="--live-scout --live-llm"
            npx tsx src/cli.ts daily --dry-run --voice kokoro $live ${SLOT:+--slot $SLOT}  # same free voice as live runs
          else
            echo "mode=live" >> "$GITHUB_OUTPUT"
            npx tsx src/cli.ts daily ${SLOT:+--slot $SLOT}
          fi

      - name: Learn from retention
        if: steps.run.outputs.mode == 'live'
        continue-on-error: true
        run: npx tsx src/cli.ts learn

      - name: Keep the video for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: work/**/*.mp4
          retention-days: 14
          if-no-files-found: ignore

      - name: Our YouTube channel's link (for the site)
        if: always() && env.YOUTUBE_REFRESH_TOKEN != ''
        continue-on-error: true
        run: npx tsx src/cli.ts channel-info

      - name: Cover images for the website
        if: always()
        continue-on-error: true
        run: npx tsx src/cli.ts covers-backfill

      - name: Build website
        if: always()
        # Public site shows published videos only. Dry-run test renders never appear on it.
        run: npx tsx src/cli.ts site

      - name: Publish website to Cloudflare Pages
        id: cloudflare
        if: always() && steps.site.outputs.kind == 'cloudflare'
        run: |
          set -o pipefail
          mkdir -p work
          npx --yes wrangler@4.151.2 pages deploy site/dist --project-name="${{ steps.site.outputs.project }}" --branch=main --commit-dirty=true 2>&1 | tee work/wrangler.log
          echo "::notice title=Cloudflare deploy::succeeded, preview $(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' work/wrangler.log | tail -1)"

      - name: Check the live site answers
        if: always() && steps.cloudflare.outcome == 'success'
        run: |
          base="${{ steps.site.outputs.base_url }}"
          # Fixed pages, the favicon set, and the three newest scam pages from the ledger.
          scams=$(node -e 'const l=require("./data/ledger.json");console.log(l.episodes.filter(e=>e.youtubeId).slice(-3).map(e=>"scam/"+e.slug+"/").join(" "))' 2>/dev/null || true)
          ok=""
          for page in "" "privacy/" "terms/" "round/" "favicon.svg" "favicon.ico" "apple-touch-icon.png" $scams; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$base/$page") && [ "$code" = "200" ] && break
              sleep 10
            done
            if [ "$code" = "200" ]; then ok="$ok /$page"
            else echo "::error title=Live check::$base/$page answered $code"; exit 1; fi
          done
          echo "::notice title=Live check::$base answered 200 for:$ok"
          if curl -s "$base/" | grep -q 'class="stage"' && curl -s "$base/assets/site.css" | grep -q -- '--bg:#0A0C0F'; then
            echo "::notice title=Look::home page has the phone, the stamp and the brand colors"
          else echo "::error title=Look::home page is not showing the new look"; exit 1; fi
          if curl -s "$base/assets/round.js" | grep -q 'Copied!'; then
            echo "::notice title=Share button::live round page copies on computers and opens the share sheet on phones"
          else echo "::error title=Share button::live round page has the old share button"; exit 1; fi

      - name: Evidence files from the live site
        if: always() && inputs.evidence && steps.cloudflare.outcome == 'success'
        run: npx tsx src/cli.ts evidence --base "${{ steps.site.outputs.base_url }}" --out docs/evidence

      - name: Forward the old GitHub Pages address to Cloudflare
        if: always() && steps.site.outputs.kind == 'cloudflare'
        run: npx tsx src/cli.ts site-redirect --out site/redirect-dist --to "${{ steps.site.outputs.base_url }}" --prefix "/${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ${{ steps.site.outputs.kind == 'cloudflare' && 'site/redirect-dist' || 'site/dist' }}

      - name: Publish website (GitHub Pages)
        id: deploy
        if: always()
        # Soft: GitHub Pages may not be switched on, and once Cloudflare is live it only forwards old links.
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Save ledger and stats
        # Dry runs save too, so the chosen website address (data/site-target.json) is kept.
        if: always()
        run: |
          git config user.name "scam-or-not-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs || true  # includes data/site-target.json, the Cloudflare project in use
          if git diff --cached --quiet; then exit 0; fi
          scripts/secret-scan.sh
          git commit -q -m "Daily run $(date -u +%F)${SLOT:+ slot $SLOT}"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep $((2**i)); done

      - name: Health check
        if: always()
        run: |
          set +e
          npx tsx src/cli.ts health
          code=$?
          set -e
          if [ "$code" = "0" ]; then echo "::notice title=Health check::passed"; else echo "::warning title=Health check::found problems (see the health issue)"; fi
          open=$(gh issue list --label health --state open --json number -q '.[0].number')
          if [ "$code" = "2" ]; then
            gh label create health --color B60205 --description "Automated health check" 2>/dev/null || true
            # Same problems as already reported: stay quiet. Only new or changed problems get a comment.
            mark="health:$(sha256sum work/health-issue.md | cut -c1-12)"
            printf '\n<!-- %s -->\n' "$mark" >> work/health-issue.md
            if [ -n "$open" ] && gh issue view "$open" --json body,comments -q '.body + ([.comments[].body] | join(" "))' | grep -q "$mark"; then echo "already reported"
            elif [ -n "$open" ]; then gh issue comment "$open" --body-file work/health-issue.md
            else gh issue create --title "Scam or Not: something broke" --label health --body-file work/health-issue.md; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Fixed: today's health check passed."
          fi
